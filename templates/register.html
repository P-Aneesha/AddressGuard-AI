<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account &mdash; AddressGuard AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="brand" style="justify-content:center; margin-bottom: 18px;">
    <span class="brand-mark">AG</span>
    <div>
      <h1>AddressGuard AI</h1>
      <p>Create your validation dashboard account</p>
    </div>
  </div>

  <form id="register-form">
    <label>Username</label>
    <input type="text" id="reg-username" autocomplete="username" minlength="3" required>
    <label>Email (optional)</label>
    <input type="email" id="reg-email" autocomplete="email">
    <label>Password</label>
    <input type="password" id="reg-password" autocomplete="new-password" minlength="6" required>
    <p class="muted" style="margin: 4px 0 0;">At least 6 characters.</p>
    <p id="register-error" class="auth-error hidden"></p>
    <button type="submit" class="btn-primary" style="width:100%; margin-top: 8px;">Create Account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
</div>

<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("register-error");
  errorEl.classList.add("hidden");

  const res = await fetch("/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("reg-username").value.trim(),
      email: document.getElementById("reg-email").value.trim(),
      password: document.getElementById("reg-password").value,
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    errorEl.textContent = data.error || "Could not create account.";
    errorEl.classList.remove("hidden");
    return;
  }
  window.location.href = "/";
});
</script>
</body>
</html>
